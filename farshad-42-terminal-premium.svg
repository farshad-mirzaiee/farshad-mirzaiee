<svg
  width="1600"
  height="420"
  viewBox="0 0 1600 420"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <style>
      .m {
        font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas,
          monospace;
      }

      .h {
        fill: #f0f6fc;
        font-size: 58px;
        font-weight: 800;
      }

      .s {
        fill: #8b949e;
        font-size: 22px;
      }

      .l {
        fill: #58a6ff;
        font-size: 19px;
        font-weight: 700;
      }

      .c {
        fill: #7ee787;
        font-size: 19px;
      }

      .w {
        fill: #f0f6fc;
        font-size: 19px;
      }

      .g {
        fill: #8b949e;
        font-size: 18px;
      }

      .t {
        fill: #6e7681;
        font-size: 14px;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" rx="24" fill="#0d1117" />

  <rect
    x="1"
    y="1"
    width="1598"
    height="418"
    rx="23"
    fill="none"
    stroke="#30363d"
  />

  <!-- Left section -->
  <text x="72" y="56" class="m t">
    42 SCHOOL • SOFTWARE ENGINEERING
  </text>

  <text x="72" y="128" class="m h">
    Farshad Mirzaiee
  </text>

  <text x="72" y="168" class="m s">
    Building strong software engineering fundamentals
  </text>

  <text x="72" y="198" class="m s">
    through the 42 curriculum.
  </text>

  <line
    x1="72"
    y1="222"
    x2="760"
    y2="222"
    stroke="#30363d"
  />

  <text x="72" y="266" class="m l">
    CURRENT FOCUS
  </text>

  <text x="72" y="308" class="m w">C</text>
  <text x="102" y="308" class="m g">•</text>

  <text x="124" y="308" class="m w">UNIX</text>
  <text x="190" y="308" class="m g">•</text>

  <text x="212" y="308" class="m w">GIT</text>
  <text x="260" y="308" class="m g">•</text>

  <text x="282" y="308" class="m w">ALGORITHMS</text>
  <text x="430" y="308" class="m g">•</text>

  <text x="452" y="308" class="m w">
    PROBLEM SOLVING
  </text>

  <text x="72" y="382" class="m t">
    ONE COMMIT AT A TIME
  </text>

  <!-- Terminal -->
  <rect
    x="915"
    y="48"
    width="615"
    height="324"
    rx="16"
    fill="#161b22"
    stroke="#30363d"
  />

  <!-- Terminal buttons -->
  <circle cx="942" cy="75" r="5" fill="#ff5f56" />
  <circle cx="962" cy="75" r="5" fill="#ffbd2e" />
  <circle cx="982" cy="75" r="5" fill="#27c93f" />

  <line
    x1="915"
    y1="92"
    x2="1530"
    y2="92"
    stroke="#30363d"
  />

  <!-- Command 1 -->
  <text x="940" y="130" class="m c">
    farshad@42
  </text>

  <text x="1058" y="130" class="m w">:</text>
  <text x="1070" y="130" class="m l">~</text>
  <text x="1085" y="130" class="m w">
    $ whoami
  </text>

  <text x="940" y="170" class="m w">
    Farshad Mirzaiee
  </text>

  <!-- Command 2 -->
  <text x="940" y="220" class="m c">
    farshad@42
  </text>

  <text x="1058" y="220" class="m w">:</text>
  <text x="1070" y="220" class="m l">~</text>
  <text x="1085" y="220" class="m w">
    $ school
  </text>

  <text x="940" y="260" class="m w">
    42 Tirana
  </text>

  <!-- Command 3 -->
  <text x="940" y="310" class="m c">
    farshad@42
  </text>

  <text x="1058" y="310" class="m w">:</text>
  <text x="1070" y="310" class="m l">~</text>
  <text x="1085" y="310" class="m w">
    $ goal
  </text>

  <text x="940" y="348" class="m w">
    Become an exceptional software engineer.
  </text>

  <!-- Blinking cursor -->
  <text x="1394" y="348" class="m w">
    ▋
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </text>
</svg>
