<svg width="1600" height="420" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#111827;#0f172a" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#1e293b;#111827" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#0f172a;#0b1220" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>
    </pattern>

    <clipPath id="clipCard">
      <rect x="0" y="0" width="420" height="220" rx="24"/>
    </clipPath>

    <style>
      .title { font: 700 44px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 0.2px; fill: #e5eefc; }
      .subtitle { font: 500 20px Inter, Segoe UI, Arial, sans-serif; fill: #93c5fd; }
      .body { font: 500 19px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .chip { font: 600 15px Inter, Segoe UI, Arial, sans-serif; fill: #e2e8f0; }
      .small { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; letter-spacing: 1.1px; }
    </style>
  </defs>

  <rect width="1280" height="320" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.65"/>

  <!-- ambient glows -->
  <circle cx="180" cy="70" r="120" fill="#38bdf8" opacity="0.11" filter="url(#blurGlow)">
    <animate attributeName="cx" values="180;230;180" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;100;70" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="245" r="120" fill="#818cf8" opacity="0.12" filter="url(#blurGlow)">
    <animate attributeName="cx" values="1120;1060;1120" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="245;210;245" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- floating dots -->
  <g opacity="0.9">
    <circle cx="920" cy="72" r="3" fill="#7dd3fc">
      <animate attributeName="cy" values="72;56;72" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="120" r="2.5" fill="#a5b4fc">
      <animate attributeName="cy" values="120;100;120" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="84" r="2.5" fill="#38bdf8">
      <animate attributeName="cy" values="84;64;84" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1095" cy="145" r="3" fill="#93c5fd">
      <animate attributeName="cy" values="145;125;145" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- left copy -->
  <text x="78" y="76" class="small">DEVELOPER PROFILE</text>

  <text x="78" y="128" class="title">Farshad Mirzaiee</text>

  <text x="78" y="168" class="subtitle">Full Stack Developer in Training</text>

  <text x="78" y="214" class="body">Building modern web apps with real projects,</text>
  <text x="78" y="242" class="body">one commit at a time.</text>

  <!-- chips -->
  <g transform="translate(78,265)">
    <rect x="0" y="0" rx="16" ry="16" width="88" height="34" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.45)"/>
    <text x="22" y="22" class="chip">React</text>

    <rect x="102" y="0" rx="16" ry="16" width="93" height="34" fill="rgba(129,140,248,0.12)" stroke="rgba(129,140,248,0.45)"/>
    <text x="121" y="22" class="chip">Node.js</text>

    <rect x="209" y="0" rx="16" ry="16" width="104" height="34" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.45)"/>
    <text x="227" y="22" class="chip">MongoDB</text>

    <rect x="327" y="0" rx="16" ry="16" width="108" height="34" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.45)"/>
    <text x="346" y="22" class="chip">Next.js</text>
  </g>

  <!-- right glass card -->
  <g transform="translate(790,50)">
    <rect x="0" y="0" width="420" height="220" rx="24" fill="rgba(15,23,42,0.52)" stroke="rgba(148,163,184,0.22)"/>
    <g clip-path="url(#clipCard)">
      <rect x="-30" y="-30" width="480" height="280" fill="url(#grid)" opacity="0.35"/>
    </g>

    <!-- terminal dots -->
    <circle cx="28" cy="28" r="5" fill="#fb7185"/>
    <circle cx="46" cy="28" r="5" fill="#fbbf24"/>
    <circle cx="64" cy="28" r="5" fill="#34d399"/>

    <!-- code lines -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#dbeafe">
      <text x="28" y="76">&lt;developer&gt;</text>
      <text x="52" y="108" fill="#93c5fd">stack = [</text>
      <text x="80" y="136">"JavaScript", "TypeScript",</text>
      <text x="80" y="162">"React", "Next.js",</text>
      <text x="80" y="188">"Node.js", "MongoDB"</text>
      <text x="52" y="214" fill="#93c5fd">]</text>
      <text x="28" y="244">&lt;/developer&gt;</text>
    </g>

    <!-- animated highlight line -->
    <rect x="70" y="149" width="230" height="2.5" fill="url(#accent)" filter="url(#softGlow)">
      <animate attributeName="x" values="52;120;52" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
