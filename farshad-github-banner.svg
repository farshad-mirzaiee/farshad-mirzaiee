<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#111827;#0f172a" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#1e293b;#111827" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#0f172a;#0b1220" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="blurGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="34" result="blur"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M 55 0 L 0 0 0 55" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>
    </pattern>

    <clipPath id="clipCard">
      <rect x="0" y="0" width="500" height="260" rx="28"/>
    </clipPath>

    <style>
      .title { font: 700 56px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 0.2px; fill: #e5eefc; }
      .subtitle { font: 500 26px Inter, Segoe UI, Arial, sans-serif; fill: #93c5fd; }
      .body { font: 500 24px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .chip { font: 600 18px Inter, Segoe UI, Arial, sans-serif; fill: #e2e8f0; }
      .small { font: 600 16px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)" opacity="0.65"/>

  <!-- ambient glows -->
  <circle cx="230" cy="90" r="150" fill="#38bdf8" opacity="0.11" filter="url(#blurGlow)">
    <animate attributeName="cx" values="230;290;230" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;120;90" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1410" cy="315" r="150" fill="#818cf8" opacity="0.12" filter="url(#blurGlow)">
    <animate attributeName="cx" values="1410;1330;1410" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="315;270;315" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- floating dots -->
  <g opacity="0.9">
    <circle cx="1160" cy="82" r="3.5" fill="#7dd3fc">
      <animate attributeName="cy" values="82;62;82" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1225" cy="142" r="3" fill="#a5b4fc">
      <animate attributeName="cy" values="142;116;142" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1305" cy="96" r="3" fill="#38bdf8">
      <animate attributeName="cy" values="96;72;96" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1390" cy="170" r="3.5" fill="#93c5fd">
      <animate attributeName="cy" values="170;145;170" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- left copy -->
  <text x="96" y="98" class="small">DEVELOPER PROFILE</text>

  <text x="96" y="165" class="title">Farshad Mirzaiee</text>

  <text x="96" y="215" class="subtitle">Full Stack Developer in Training</text>

  <text x="96" y="275" class="body">Building modern web apps with real projects,</text>
  <text x="96" y="310" class="body">one commit at a time.</text>

  <!-- chips -->
  <g transform="translate(96,342)">
    <rect x="0" y="0" rx="18" ry="18" width="110" height="40" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.45)"/>
    <text x="28" y="25" class="chip">React</text>

    <rect x="126" y="0" rx="18" ry="18" width="118" height="40" fill="rgba(129,140,248,0.12)" stroke="rgba(129,140,248,0.45)"/>
    <text x="151" y="25" class="chip">Node.js</text>

    <rect x="260" y="0" rx="18" ry="18" width="132" height="40" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.45)"/>
    <text x="283" y="25" class="chip">MongoDB</text>

    <rect x="408" y="0" rx="18" ry="18" width="126" height="40" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.45)"/>
    <text x="435" y="25" class="chip">Next.js</text>
  </g>

  <!-- right glass card -->
  <g transform="translate(990,78)">
    <rect x="0" y="0" width="500" height="260" rx="28" fill="rgba(15,23,42,0.52)" stroke="rgba(148,163,184,0.22)"/>
    <g clip-path="url(#clipCard)">
      <rect x="-30" y="-30" width="560" height="320" fill="url(#grid)" opacity="0.35"/>
    </g>

    <!-- terminal dots -->
    <circle cx="32" cy="32" r="5.5" fill="#fb7185"/>
    <circle cx="52" cy="32" r="5.5" fill="#fbbf24"/>
    <circle cx="72" cy="32" r="5.5" fill="#34d399"/>

    <!-- code lines -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#dbeafe">
      <text x="34" y="86">&lt;developer&gt;</text>
      <text x="64" y="126" fill="#93c5fd">stack = [</text>
      <text x="98" y="160">"JavaScript", "TypeScript",</text>
      <text x="98" y="191">"React", "Next.js",</text>
      <text x="98" y="222">"Node.js", "MongoDB"</text>
      <text x="64" y="254" fill="#93c5fd">]</text>
      <text x="34" y="292">&lt;/developer&gt;</text>
    </g>

    <!-- animated highlight line -->
    <rect x="96" y="186" width="270" height="3" fill="url(#accent)" filter="url(#softGlow)">
      <animate attributeName="x" values="84;150;84" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
